name: Official Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || exit 1
          test -n "$KEYSTORE_PASSWORD" || exit 1
          test -n "$KEY_ALIAS" || exit 1

          mkdir -p "$RUNNER_TEMP/signing"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/signing/release.keystore"

          test -s "$RUNNER_TEMP/signing/release.keystore"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "UEPakExplorer-v${{ inputs.version }}-arm64-v8a.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"

          gh release create "$TAG" \
            "UEPakExplorer-v${{ inputs.version }}-arm64-v8a.apk" \
            --title "UEPakExplorer v${{ inputs.version }}" \
            --generate-notes
