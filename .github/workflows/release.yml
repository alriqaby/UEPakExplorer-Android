name: Official Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      # ---------------------------------------------------
      # Restore keystore and build signed release APK
      # ---------------------------------------------------
      #
      # Everything happens in ONE GitHub Actions step.
      # This intentionally avoids relying on GITHUB_ENV
      # between separate steps for KEYSTORE_FILE.
      # ---------------------------------------------------

      - name: Restore keystore and build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          KEYSTORE_FILE="$RUNNER_TEMP/uepak-explorer-release.p12"

          echo "[1/4] Restoring private release keystore..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is empty."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore restoration failed."
            exit 1
          fi

          echo "[OK] Keystore restored."

          echo "[2/4] Verifying keystore..."

          keytool -list             -keystore "$KEYSTORE_FILE"             -storetype PKCS12             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"             >/dev/null

          echo "[OK] Keystore and alias verified."

          echo "[3/4] Starting Gradle..."

          export KEYSTORE_FILE
          export KEYSTORE_PASSWORD
          export KEY_ALIAS

          gradle :app:assembleRelease --no-daemon

          echo "[4/4] Signed APK build completed."

      # ---------------------------------------------------
      # Prepare APK
      # ---------------------------------------------------

      - name: Prepare release files
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          cp "$APK" "release/UEPakExplorer-v1.0.0-arm64.apk"

          sha256sum "release/UEPakExplorer-v1.0.0-arm64.apk" \
            > "release/SHA256SUMS.txt"

          echo "Release APK:"
          ls -lh release/

      # ---------------------------------------------------
      # Publish GitHub Release
      # ---------------------------------------------------

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.0" \
            release/UEPakExplorer-v1.0.0-arm64.apk \
            release/SHA256SUMS.txt \
            --title "UEPak Explorer v1.0.0" \
            --notes-file /dev/stdin <<'RELEASE_NOTES'
## UEPak Explorer v1.0.0

The first official release of UEPak Explorer for Android.

### Features

- Unreal Engine PAK file exploration
- PAK version detection
- Encryption status detection
- Compression information
- File count and file listing
- File search
- File extraction
- Localization and font file discovery
- Dark and light themes
- Native ARM64 support
- No root required
- No Windows or external runtime required

### Compatibility

- Android 8.0+
- ARM64 (`arm64-v8a`)
- Designed for modern Android devices

### Security

This release is digitally signed using the project's private release keystore.

### Checksums

See `SHA256SUMS.txt` for the SHA-256 checksum of the APK.
RELEASE_NOTES

      - name: Release summary
        run: |
          echo "========================================"
          echo " UEPak Explorer v1.0.0 RELEASED"
          echo "========================================"
          echo
          echo "GitHub Release:"
          gh release view "v1.0.0"
